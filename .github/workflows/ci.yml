name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/schema-ui-library-v1

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.23.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm build
      - run: pnpm test:coverage
      - run: pnpm storybook:build

  browser:
    name: Browser and visual gates (Windows Chromium)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22.23.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:storybook
      - run: pnpm test:e2e
      - run: pnpm test:visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: browser-test-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
